name: daily-watch
on:
  schedule:
    # 매일 22:40 UTC = 07:40 KST. buzz(19:17)·classify(21:23) 뒤, **같은 UTC 날짜 안**.
    # 자정(UTC)을 넘겨서 돌면 "오늘 측정 0건" 으로 읽혀 오탐이 난다.
    - cron: '40 22 * * *'
  workflow_dispatch:

# 읽기만 한다 — data/ 를 고치지 않으므로 쓰기 락도, 커밋도 없다.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # API 키를 주지 않는다. 감시가 키에 의존하면 키가 문제일 때 감시부터 죽는다.
      # 이상이 있으면 exit 1 -> GitHub 이 계정 메일로 실패를 알린다.
      # PC 가 꺼져 있어도 닿는 유일한 경로다.
      - run: npm run watch
