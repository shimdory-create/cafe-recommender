name: daily-watch
on:
  schedule:
    # 매일 22:40 UTC = 07:40 KST. buzz(19:17)·classify(21:23) 뒤, **같은 UTC 날짜 안**.
    # 자정(UTC)을 넘겨서 돌면 "오늘 측정 0건" 으로 읽혀 오탐이 난다.
    - cron: '40 22 * * *'
    # **예비 실행.** GitHub 무료 스케줄러는 혼잡하면 조용히 건너뛴다 —
    # 2026-08-24 에 daily-classify 와 daily-watch 가 통째로 실행되지 않았다.
    # 실패는 메일이 오지만 **안 도는 것은 아무 신호도 없다.** 감시가 죽으면
    # 나머지 이상도 전부 조용해지므로 여기만 두 번 시도한다 (0.3분짜리다).
    #
    # 시각은 **같은 UTC 날짜 안, buzz·classify 뒤**여야 한다. 앞에 두면
    # 그날 측정이 아직 없어 "오늘 0건" 오탐이 난다.
    - cron: '52 23 * * *'
  workflow_dispatch:

# 읽기만 한다 — data/ 를 고치지 않으므로 쓰기 락도, 커밋도 없다.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # API 키를 주지 않는다. 감시가 키에 의존하면 키가 문제일 때 감시부터 죽는다.
      # 이상이 있으면 exit 1 -> GitHub 이 계정 메일로 실패를 알린다.
      # PC 가 꺼져 있어도 닿는 유일한 경로다.
      - run: npm run watch
