name: daily-classify-spot
on:
  schedule:
    # 22:29 UTC. daily-classify-restaurant(21:56 UTC)와 33분 차이.
    - cron: '29 22 * * *'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 333: Gemini 무료 쿼터를 카페·식당·가볼 곳 셋이 나눠 쓴다(2026-09-02, 3분할).
      # daily-classify.yml 상단 주석 참고.
      - run: npm run spot-classify -- --limit 333 --redo
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "가볼 곳 판정 갱신"
