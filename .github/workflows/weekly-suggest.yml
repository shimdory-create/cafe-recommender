name: weekly-suggest
on:
  schedule:
    - cron: '30 2 * * 5'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run suggest
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 표시용 페이로드를 함께 갱신한다 — Vercel 은 web/ 만 빌드하므로
      # 이 파일이 최신이어야 사이트가 최신이 된다
      - run: npm run site
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git add data/ web/src/generated/
          git diff --staged --quiet || git commit -m "data: 주말 후보 $(date -u +%Y-%m-%d)"
          git push
