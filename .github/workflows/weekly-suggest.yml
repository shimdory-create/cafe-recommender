name: weekly-suggest
on:
  schedule:
    - cron: '30 2 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run suggest
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: 주말 후보 $(date -u +%Y-%m-%d)"
          git push
