name: weekly-suggest
on:
  schedule:
    # 목 19:47 UTC = **금 04:47 KST**.
    #
    # 원래 금 11:24 KST(02:24 UTC)였다. 그런데 실측에서 04:24 UTC 에 시작했다 —
    # **2시간 늦어 정오 카톡보다 뒤로 밀렸다.** GitHub 스케줄러는 늦는 것이
    # 정상이고 보장이 없다. 그래서 카톡보다 7시간 앞에 둔다.
    #
    # 같은 날 04:17 KST 화제량 수집(19:17 UTC) 직후이므로 가장 신선한 데이터를 쓴다.
    - cron: '47 19 * * 4'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run suggest
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다.
      # 생성물(site.json)은 병합하지 않고 다시 만든다 — 파생물이라
      # 합쳐진 JSON 은 어느 쪽 데이터와도 일치하지 않는다.
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "주말 후보"
