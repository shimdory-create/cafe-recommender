name: daily-buzz
on:
  schedule:
    # 정시(19:00 UTC)는 스케줄러가 가장 붐비는 시각이라 실행이 밀리거나
    # 건너뛰어진다 (GitHub 문서가 권고하는 회피책: 정시를 피한다).
    - cron: '17 19 * * *'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run buzz
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다.
      # 생성물(site.json)은 병합하지 않고 다시 만든다 — 파생물이라
      # 합쳐진 JSON 은 어느 쪽 데이터와도 일치하지 않는다.
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "화제량 갱신"
