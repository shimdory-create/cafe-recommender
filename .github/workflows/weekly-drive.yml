name: weekly-drive
on:
  schedule:
    # 매주 토 22:00 UTC = 일 07:00 KST.
    # daily-classify 가 매일 21:00 UTC 에 도므로 겹치지 않게 60분 뒤로 둔다
    # (겹치면 data/ 쓰기 락에 걸려 한쪽이 실패한다).
    - cron: '0 22 * * 6'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 카페는 움직이지 않으므로 이미 측정한 곳은 건너뛴다.
      # 무료 한도 10,000/일 대비 사용량이 무시할 수준이다.
      - run: npm run drive -- --limit 2000
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # 길찾기에 LLM 은 쓰지 않지만 환경변수 검증이 provider 키를 요구한다.
          # 없으면 잡이 첫 줄에서 죽는다 (실측).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 표시용 페이로드를 함께 갱신한다 — Vercel 은 web/ 만 빌드하므로
      # 이 파일이 최신이어야 사이트가 최신이 된다
      - run: npm run site
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git add data/ web/src/generated/
          git diff --staged --quiet || git commit -m "data: 실주행 시간 $(date -u +%Y-%m-%d)"
          git push
