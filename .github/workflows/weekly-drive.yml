name: weekly-drive
on:
  schedule:
    # 매주 토 20:00 UTC = 일 05:00 KST. 신규 통과분만 재므로 호출이 적다.
    - cron: '0 20 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 카페는 움직이지 않으므로 이미 측정한 곳은 건너뛴다.
      # 무료 한도 10,000/일 대비 사용량이 무시할 수준이다.
      - run: npm run drive -- --limit 2000
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: 실주행 시간 $(date -u +%Y-%m-%d)"
          git push
