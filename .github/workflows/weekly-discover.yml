name: weekly-discover
on:
  schedule:
    # 일 18:58 UTC. 정시(19:00 UTC)는 스케줄러가 가장 붐비는 시각이라
    # 피한다(daily-buzz.yml 참고). 주 초에 새 카페를 넣어두면 daily-classify
    # 가 금요일 추천 확정까지 나흘에 걸쳐 판정한다.
    #
    # **반드시 그날 daily-buzz(19:17 UTC) 보다 앞서야 한다.** classify 는
    # 화제량이 없는 pending 카페를 탈락시키지 않고 다음 회차로 미룬다 —
    # discover 가 buzz 뒤에 돌면 그날 막 발굴된 카페는 화제량을 놓쳐
    # 최소 하루를 그냥 흘려보낸다(실측: 일요일 발굴분이 월요일 낮까지도
    # 판정 대기로 남아 있었다, 2026-09-07). 앞에 두면 같은 날 buzz 가
    # 새로 들어온 카페까지 측정해 그날 밤 classify 로 바로 이어진다.
    - cron: '58 18 * * 0'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 2026-09-28: GitHub Actions 무료 한도 소진 계기로 격주 실행으로
      # 낮췄다 (scripts/biweekly-gate.sh 참고). 이 스텝만 돌고 몇 초 만에
      # 끝나는 주가 절반이다 — 정상이다.
      - id: week-check
        run: bash scripts/biweekly-gate.sh
      - uses: actions/setup-node@v7
        if: steps.week-check.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.week-check.outputs.run == 'true'
      - run: npm run discover
        if: steps.week-check.outputs.run == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 화제 식음(dormant) 후보를 신규 발굴과 같은 격주 주기로 재확인한다
      # (2026-09-28, src/jobs/dormant-recheck.ts). daily-buzz 의 매일
      # 회전에는 일부러 안 끼워 뒀다 — 거기 끼우면 상한제를 만든 목적
      # (하루 재기록 비용 억제)이 도로 무너진다.
      - run: npm run dormant-recheck
        if: steps.week-check.outputs.run == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다.
      # 생성물(site.json)은 병합하지 않고 다시 만든다 — 파생물이라
      # 합쳐진 JSON 은 어느 쪽 데이터와도 일치하지 않는다.
      - name: 데이터 커밋
        if: steps.week-check.outputs.run == 'true'
        run: bash scripts/commit-data.sh "신규 발굴"
