name: weekly-liveness-restaurant
on:
  schedule:
    # 일 23:06 UTC. weekly-liveness(카페, 일 22:33 UTC)와 33분 차이 —
    # concurrency 그룹이 달라 동시에 돌 수 있으므로 npm ci 동시 실행을 피하려면
    # 시각도 띄워야 한다.
    - cron: '6 23 * * 0'
  workflow_dispatch:

# data/ 를 쓰는 식당 워크플로는 하나씩 돈다 (weekly-drive-restaurant.yml 주석 참고)
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run restaurant-liveness
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # 길찾기와 같은 이유로 provider 키가 있어야 환경변수 검증을 통과한다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다 — 카페와 공용.
      # npm run --silent site 가 카페·식당 페이로드를 둘 다 다시 만든다
      # (2단계 웹 화면이 생긴 뒤로는 이걸 건너뛰면 화면이 절대 안 갱신된다).
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "식당 실존 확인"
