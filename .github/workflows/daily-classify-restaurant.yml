name: daily-classify-restaurant
on:
  schedule:
    # 21:56 UTC. daily-classify(카페, 21:23 UTC)와 33분 차이 —
    # concurrency 그룹이 달라 동시에 돌 수 있으므로 npm ci 동시 실행을 피하려면
    # 시각도 띄워야 한다.
    - cron: '56 21 * * *'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 전부 하나씩 돈다 — 카페와 같은 data-write 그룹을
# 공유한다 (daily-buzz-restaurant.yml 주석 참고).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 333: Gemini 무료 쿼터를 카페·식당·가볼 곳 셋이 나눠 쓴다(2026-09-02, 3분할).
      # daily-classify.yml 상단 주석 참고.
      - run: npm run restaurant-classify -- --limit 333 --redo
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다 — 카페와 공용.
      # npm run --silent site 가 카페·식당 페이로드를 둘 다 다시 만든다
      # (2단계 웹 화면이 생긴 뒤로는 이걸 건너뛰면 화면이 절대 안 갱신된다).
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "식당 판정 갱신"
