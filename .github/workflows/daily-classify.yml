name: daily-classify
on:
  schedule:
    # 정시를 피한다 (스케줄러 혼잡 시 건너뛰어진다)
    - cron: '23 21 * * *'
    # 하루 2번째 실행 — 새벽 사이클(19~23시 UTC)과 12시간 띄워 다른 잡과
    # 안 겹치게 한다(2026-09-02, 처리량 확대).
    - cron: '23 9 * * *'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --redo-stale: 프롬프트를 고치면 낡은 판본을 먼저 갱신한다.
      # 새 카페를 늘리는 것보다 판정을 일관되게 유지하는 것이 급하다.
      #
      # 333: Gemini 무료 쿼터를 카페·식당·가볼 곳 셋이 나눠 쓴다 (같은
      # GEMINI_API_KEY). 한 도메인이 먼저 돌면서 하루치를 다 써버리면 뒤에
      # 도는 도메인은 쿼터가 없어 429 만 받는다 — 순서와 무관하게 세 도메인이
      # 비슷하게 나눠 받도록 200 에서 333 으로 맞췄다(2026-09-02, 3분할).
      - run: npm run classify -- --limit 333 --redo-stale
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다.
      # 생성물(site.json)은 병합하지 않고 다시 만든다 — 파생물이라
      # 합쳐진 JSON 은 어느 쪽 데이터와도 일치하지 않는다.
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "판정 갱신"
