name: daily-classify
on:
  schedule:
    # 정시를 피한다 (스케줄러 혼잡 시 건너뛰어진다)
    - cron: '23 21 * * *'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 하나씩 돈다.
#
# 각 잡이 cafes.json 전체를 읽고 고쳐 다시 쓰므로 겹치면 나중에 쓴 쪽이
# 앞선 쪽 작업을 통째로 날린다. 로컬은 data/.lock 이 막지만 Actions 는
# 러너가 매번 새 머신이라 파일 락이 닿지 않는다. GitHub 이 직렬화해 준다.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --redo-stale: 프롬프트를 고치면 낡은 판본을 먼저 갱신한다.
      # 새 카페를 늘리는 것보다 판정을 일관되게 유지하는 것이 급하다.
      - run: npm run classify -- --limit 200 --redo-stale
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 표시용 페이로드를 함께 갱신한다 — Vercel 은 web/ 만 빌드하므로
      # 이 파일이 최신이어야 사이트가 최신이 된다
      - run: npm run site
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          # 순서가 중요하다. 잡이 방금 data/ 를 고쳐놨으므로 먼저 커밋해야 한다 —
          # 커밋 전에 pull --rebase 를 하면 "cannot pull with rebase: You have
          # unstaged changes" 로 죽는다 (실측: 다섯 워크플로 전부 이 지점에서 실패).
          git add data/ web/src/generated/
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: 판정 갱신 $(date -u +%Y-%m-%d)"
          # 웹앱이 별점·방문을 같은 브랜치에 커밋하므로 그 사이에 원격이 앞서
          # 있을 수 있다. 세 번까지 다시 붙인다.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push && exit 0
            echo "재시도 $i"
            sleep 5
          done
          exit 1
