name: daily-classify
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --redo-stale: 프롬프트를 고치면 낡은 판본을 먼저 갱신한다.
      # 새 카페를 늘리는 것보다 판정을 일관되게 유지하는 것이 급하다.
      - run: npm run classify -- --limit 200 --redo-stale
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 데이터 커밋
        run: |
          git config user.name  "cafe-bot"
          git config user.email "cafe-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: 판정 갱신 $(date -u +%Y-%m-%d)"
          git push
