name: weekly-discover-restaurant
on:
  schedule:
    # 일 20:10 UTC. weekly-discover(카페, 일 19:37 UTC)와 33분 차이 —
    # concurrency 그룹이 달라 동시에 돌 수 있으므로 npm ci 동시 실행을 피하려면
    # 시각도 띄워야 한다.
    - cron: '10 20 * * 0'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 전부 하나씩 돈다 — 카페와 같은 data-write 그룹을
# 공유한다 (daily-buzz-restaurant.yml 주석 참고).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 파일럿 지역만 스캔한다 (부평구·계양구·서구·김포시·검단구) — 전체
      # 수도권으로 확장하기 전에 소규모로 먼저 돌려본다.
      - run: npm run restaurant-discover -- --pilot
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다 — 카페와 공용.
      # npm run --silent site 가 카페·식당 페이로드를 둘 다 다시 만든다
      # (2단계 웹 화면이 생긴 뒤로는 이걸 건너뛰면 화면이 절대 안 갱신된다).
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "식당 신규 발굴"
