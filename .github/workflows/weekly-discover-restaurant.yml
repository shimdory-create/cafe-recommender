name: weekly-discover-restaurant
on:
  schedule:
    # 일 19:35 UTC. **반드시 그날 daily-buzz-restaurant(19:50 UTC) 보다
    # 앞서야 한다** — 뒤에 두면 그날 발굴된 식당이 화제량을 놓쳐 판정이
    # 최소 하루 밀린다(weekly-discover.yml 주석 참고, 카페에서 실측된
    # 문제를 식당도 똑같이 겪는다).
    - cron: '35 19 * * 0'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 전부 하나씩 돈다 — 카페와 같은 data-write 그룹을
# 공유한다 (daily-buzz-restaurant.yml 주석 참고).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 파일럿 지역(부평구·계양구·서구·김포시·검단구)에서 118곳 판정까지
      # 검증 완료(2026-09-02) — 카페처럼 수도권 전체(66개 시군구)로 확장한다.
      - run: npm run restaurant-discover
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다 — 카페와 공용.
      # npm run --silent site 가 카페·식당 페이로드를 둘 다 다시 만든다
      # (2단계 웹 화면이 생긴 뒤로는 이걸 건너뛰면 화면이 절대 안 갱신된다).
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "식당 신규 발굴"
