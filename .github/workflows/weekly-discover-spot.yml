name: weekly-discover-spot
on:
  schedule:
    # 월 20:05 UTC. 카페·식당의 일요일 data-write 혼잡(동시 대기 2건 초과 시
    # 3번째가 조용히 취소됨)을 피해 월요일로 옮김.
    #
    # **반드시 그날 daily-buzz-spot(20:23 UTC) 보다 앞서야 한다** — 뒤에
    # 두면 그날 발굴된 곳이 화제량을 놓쳐 판정이 최소 하루 밀린다
    # (weekly-discover.yml 주석 참고).
    - cron: '5 20 * * 1'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 파일럿 지역(부평구·계양구·서구·김포시·검단구)에서 판정까지 검증
      # 완료(2026-09-02) — 식당·카페처럼 수도권 전체로 확장한다.
      - run: npm run spot-discover
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "가볼 곳 신규 발굴"
