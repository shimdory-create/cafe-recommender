name: daily-buzz-restaurant
on:
  schedule:
    # 19:50 UTC. daily-buzz(카페, 19:17 UTC)와 33분 차이 —
    # concurrency 그룹이 달라 동시에 돌 수 있으므로 npm ci 동시 실행을 피하려면
    # 시각도 띄워야 한다.
    - cron: '50 19 * * *'
  workflow_dispatch:

# data/ 를 쓰는 워크플로는 전부 하나씩 돈다 — 카페와 같은 data-write 그룹을
# 공유한다. 둘 다 commit-data.sh 로 web/src/generated/ 를 다시 만드는데,
# 그 생성물은 병합이 아니라 재생성으로 처리하므로 동시에 쓰면 서로의 결과를
# 덮어쓴다 (한때는 별도 그룹이었는데, 2단계에서 site-restaurant.json 도
# 카페와 같은 site.json 생성 명령을 공유하게 되면서 다시 합쳤다).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run restaurant-buzz
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 커밋·푸시 규칙은 scripts/commit-data.sh 한 곳에 있다 — 카페와 공용.
      # npm run --silent site 가 카페·식당 페이로드를 둘 다 다시 만든다
      # (2단계 웹 화면이 생긴 뒤로는 이걸 건너뛰면 화면이 절대 안 갱신된다).
      - name: 데이터 커밋
        run: bash scripts/commit-data.sh "식당 화제량 갱신"
